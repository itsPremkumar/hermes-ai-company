# Verified-good docker-compose.yml for a Node/TS app (tsx-run).
# Copy as `docker-compose.yml`, adjust ports/paths/health route.
#
# Why it works:
#   - platform: linux/amd64 pins the runtime arch so ffmpeg-static / native
#     addons fetch the correct x64 binary (no ARM "invalid ELF" errors)
#   - healthcheck hits the REAL route (/api/health), matching the Dockerfile
#   - optional Voicebox sidecar (commented) for GPU/CPU voice-clone backend

services:
  video-generator:
    build:
      context: .
      dockerfile: Dockerfile
    image: automated-video-generator:latest
    container_name: automated-video-generator
    platform: linux/amd64
    ports:
      - "3001:3001"
    volumes:
      - ./input:/app/input
      - ./output:/app/output
      - ./public:/app/public
      - ./.env:/app/.env:ro
    environment:
      - NODE_ENV=production
      - PORT=3001
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3001/api/health', r => process.exit(r.statusCode===200?0:1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

